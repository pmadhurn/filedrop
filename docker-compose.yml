services:
  app:
    build: .
    image: filedrop:latest
    container_name: filedrop
    restart: unless-stopped
    env_file: .env
    environment:
      DATA_DIR: /data
      PORT: "8140"
      NODE_ENV: production
      CORS_ORIGINS: https://id.madhur.dev
    volumes:
      # Database, uploaded files, in-progress chunks and logs all live here.
      - filedrop-data:/data
    ports:
      # Loopback only: the public path is Cloudflare Tunnel, never an open port.
      - "127.0.0.1:8140:8140"
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    ulimits:
      nofile: 65535
    deploy:
      resources:
        limits:
          memory: 1g
          cpus: "2.0"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8140/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  # Front door for madhur.dev: share-shaped paths go to FileDrop, everything
  # else (and anything FileDrop does not recognise) goes to the existing site.
  madhur-shim:
    image: nginx:1.27-alpine
    container_name: filedrop-shim
    restart: unless-stopped
    depends_on:
      - app
    volumes:
      - ./nginx/madhur-shim.conf:/etc/nginx/conf.d/default.conf:ro
    # Host network so the shim can reach the existing site on 127.0.0.1:8090;
    # nginx itself binds 127.0.0.1:8141 only, nothing is exposed publicly.
    network_mode: host
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"

volumes:
  filedrop-data:

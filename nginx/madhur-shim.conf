# madhur.dev front door.
#
# The existing site keeps every route it has today. Only paths that look like a
# share ID (4-6 letters, nothing else) are offered to FileDrop, and if FileDrop
# does not know that ID — or is down — the request falls through to the site.

# The shim runs on the host network so it can reach both loopback services:
# FileDrop (published on 127.0.0.1:8140) and the existing site on :8090.
upstream filedrop_app { server 127.0.0.1:8140; keepalive 8; }
upstream devfolio     { server 127.0.0.1:8090; keepalive 8; }

map $http_upgrade $connection_upgrade { default upgrade; '' close; }

server {
    listen 127.0.0.1:8141;
    server_name _;

    server_tokens off;
    client_max_body_size 0;          # chunk size is enforced by the app
    proxy_http_version 1.1;
    proxy_request_buffering off;     # stream uploads straight through
    proxy_buffering off;             # stream downloads straight back
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;

    # FileDrop's own endpoints on the apex domain: share pages need these to
    # work when a link is opened as madhur.dev/abcd.
    location ^~ /d/        { proxy_pass http://filedrop_app; }
    location ^~ /api/s/    { proxy_pass http://filedrop_app; }

    # /assets/ is shared territory: FileDrop's UI bundles AND the portfolio's
    # Vite bundles both live under it. Offer FileDrop first; its 404 means
    # "not one of mine" and the request falls through to the site. Routing
    # this location to FileDrop unconditionally is what blanked the portfolio
    # for every visitor (its hashed JS/CSS all 404'd as FileDrop JSON).
    location ^~ /assets/ {
        proxy_pass http://filedrop_app;
        proxy_intercept_errors on;
        error_page 404 500 502 503 504 = @site;
    }

    # Share-shaped paths. A 404 from FileDrop means "not one of mine", and a
    # 5xx means it is unavailable — both fall through to the existing site.
    location ~* "^/[A-Za-z]{4,6}$" {
        proxy_pass http://filedrop_app;
        proxy_intercept_errors on;
        error_page 404 500 502 503 504 = @site;
    }

    location @site { proxy_pass http://devfolio; }
    location /     { proxy_pass http://devfolio; }
}
